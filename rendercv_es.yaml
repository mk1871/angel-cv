cv:
  name: ANGEL MANUEL CASTAÑEDA URIBE
  location: Bucaramanga, Colombia
  email: manuelkas2022@gmail.com
  phone: (+57) 315-604-6142
  social_networks:
    - network: GitHub
      username: mk1871
  sections:
    resumen_profesional:
      - Tecnólogo en Desarrollo de Software con sólida experiencia en backend, gestión de servidores Linux (AlmaLinux/Arch) y automatización con Python.
      - Especializado en la implementación de soluciones seguras y eficientes. He configurado firewalls perimetrales (Endian) y realizado auditorías de seguridad en entornos controlados (Kali/Parrot).
      - Busco aplicar mis habilidades técnicas y pasión por la ciberseguridad para proteger y optimizar infraestructuras críticas.
    habilidades_técnicas:
      - label: Sistemas
        details: Linux (AlmaLinux, Arch, Kali, Parrot)
      - label: Seguridad
        details: Endian Firewall, Nmap, Wireshark, Auditoría Wireless (Lab)
      - label: Lenguajes
        details: Python, Bash, PHP, JavaScript, SQL
      - label: Backend
        details: Laravel, Node.js, APIs REST
      - label: Datos
        details: PostgreSQL, MySQL, Supabase
      - label: Automatización & Scripting
        details: Selenium, Playwright, Python, Bash
      - label: Full Stack
        details: Vue.js, TailwindCSS, Git (Trabajo en Equipo)
      - label: Cloud
        details: AWS S3 (Integración nivel código)
    experiencia_profesional:
      - company: SCALA COLOMBIA SAS
        position: Desarrollador Backend & Automatización (Contrato de Aprendizaje)
        start_date: 2024-09
        end_date: 2025-05
        location: Remoto
        highlights:
          - Desarrollo de backend con Laravel para consumo de APIs externas (Twilio, Retell, Synthflow).
          - Implementación de procesos ETL (Extracción, Transformación y Carga) para generar reportes diarios de CVs y logs.
          - Automatización de escritura y almacenamiento seguro de logs y archivos en AWS S3.
          - Optimización de bases de datos y colaboración directa con el equipo de análisis de datos.
      - company: Freelance
        position: Desarrollador Web Full Stack & Soporte Remoto
        start_date: 2020-01
        end_date: present
        location: Remoto
        highlights:
          - Desarrollo de aplicaciones web seguras (Full Stack) utilizando Supabase, Vue.js y TailwindCSS.
          - Implementación y configuración de firewalls perimetrales (Endian) y servidores Linux (AlmaLinux) para clientes.
          - Auditoría de seguridad en redes inalámbricas y pruebas de penetración en entornos controlados (Lab) usando Nmap/Kali.
          - Creación de scripts de automatización en Python y Bash para administración de sistemas.
          - Soporte técnico remoto avanzado y mantenimiento de infraestructura con herramientas como RustDesk.
      - company: C & S Computadores
        position: Técnico Principal de Soporte y Redes
        start_date: 2016-01
        end_date: 2020-12
        location: Bucaramanga, Colombia
        highlights:
          - Diagnóstico y resolución de fallos de hardware y software en equipos de cómputo.
          - Configuración básica de redes LAN y resolución de problemas de conectividad.
          - Lideré la actualización tecnológica de la infraestructura interna.
    educación:
      - institution: SENA, Centro Tecnológico del Mobiliario
        area: Análisis y Desarrollo de Software
        degree: Tecnólogo
        date: Jul 2025
        location: Itagüí, Colombia
